name: store_mate
description: "StoreMate es una innovadora aplicación móvil diseñada para empoderar a propietarios de pequeños negocios al proporcionarles una solución completa de punto de venta en la palma de su mano. Con StoreMate, los usuarios pueden gestionar fácilmente todas las facetas de su negocio, desde el seguimiento del inventario hasta el procesamiento de ventas, todo desde su propio teléfono inteligente."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  date_format: ^2.0.7
  sqflite: ^2.3.3
  path: ^1.9.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  flutter_bloc: ^8.1.6
  anim_search_bar: ^2.0.3
  image_picker: ^1.1.2
  barcode_scan2: ^4.3.3
  screenshot: ^3.0.0
  qr_flutter: ^4.1.0
  flutter_native_splash: ^2.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Italic.ttf
        - asset: fonts/Roboto-BlackItalic.ttf
        - asset: fonts/Roboto-Black.ttf
        - asset: fonts/Roboto-BoldItalic.ttf
        - asset: fonts/Roboto-Bold.ttf
        - asset: fonts/Roboto-LightItalic.ttf
        - asset: fonts/Roboto-Light.ttf
        - asset: fonts/Roboto-ThinItalic.ttf
        - asset: fonts/Roboto-Thin.ttf
        - asset: fonts/Roboto-MediumItalic.ttf
        - asset: fonts/Roboto-Medium.ttf
          style: italic

flutter_native_splash:
  color: "#F5F5F5"
  image: assets/logo.png
  color_dark: "#F5F5F5"

  android_12:
    image: assets/logo.png
    color: "#F5F5F5"
    color_dark: "#F5F5F5"
  web: true
  fullscreen: true
